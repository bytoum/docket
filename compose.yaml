services:
  docket:
    image: bytoum/docket:latest
    restart: unless-stopped
    # Optional memory limits. Docket uses about 250 MB, more while deploying.
    # Keep mem_limit at 384m or above, or deploys can be killed.
    # mem_reservation: 256m
    # mem_limit: 512m
    ports:
      # Host Port : Container Port
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
        
      # If you want to use private registries, you need to share the auth file with Docket:
      # - /root/.docker/:/root/.docker

      # Stacks Directory
      # ⚠️ READ IT CAREFULLY. If you did it wrong, your data could end up writing into a WRONG PATH.
      # ⚠️ 1. FULL path only. No relative path (MUST)
      # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Docket where your stacks directory is
      - DOCKET_STACKS_DIR=/opt/stacks
