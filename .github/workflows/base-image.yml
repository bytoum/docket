name: Base image to Docker Hub

# Builds docker/Base.Dockerfile (Node 22, Docker CLI, Docker Compose plugin,
# tsx) for amd64 and arm64 and pushes it as bytoum/docket:base. The Docket
# image (docker/Dockerfile) is built on top of it.
#
# Runs when docker/Base.Dockerfile changes on main, or by hand from the
# Actions tab (for example to pick up a newer Docker CLI or Compose).
# Run it once before the first release that uses bytoum/docket:base.
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write access).

on:
  push:
    branches: [main]
    paths:
      - docker/Base.Dockerfile
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-image
  cancel-in-progress: false

env:
  IMAGE: bytoum/docket

jobs:
  build:
    name: Build and push base
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The base only installs packages, so emulating arm64 is fast enough
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:base
